<app-modal-base [open]="open()" title="Nuevo recordatorio" (closed)="close()">
  <form class="form" (submit)="$event.preventDefault(); save()">
    <app-form-field
      label="Título"
      placeholder="Ej. Entregar informe de estadística"
      fieldId="reminder-title"
      [required]="true"
      [(value)]="title"
    />

    <div class="form__row">
      <app-form-field label="Fecha" inputType="date" fieldId="reminder-date" [(value)]="date" />
      <app-form-field label="Hora" inputType="time" fieldId="reminder-time" [(value)]="time" />
    </div>

    <div class="form__row">
      <app-form-field
        type="select"
        label="Categoría"
        placeholder="Seleccionar categoría"
        fieldId="reminder-category"
        [options]="categories()"
        [(value)]="category"
      />
      <app-form-field
        label="Lugar (opcional)"
        placeholder="Ej. Bloque C · Salón 302"
        fieldId="reminder-place"
        [(value)]="place"
      />
    </div>

    <app-form-field
      type="textarea"
      label="Notas (opcional)"
      placeholder="Detalles adicionales..."
      fieldId="reminder-notes"
      [(value)]="notes"
    />

    <div class="form__actions">
      <app-button variant="text" (click)="close()">Cancelar</app-button>
      <app-button variant="primary" type="submit" [disabled]="!title().trim()">Crear recordatorio</app-button>
    </div>
  </form>
</app-modal-base>
