<div class="agenda-toolbar">
  <div class="agenda-toolbar__nav">
    <app-button variant="secondary" [iconOnly]="true" (click)="move(-1)">
      <app-icon name="chevron-left" [size]="18" color="currentColor" />
    </app-button>
    <app-button variant="secondary" (click)="today()">Hoy</app-button>
    <app-button variant="secondary" [iconOnly]="true" (click)="move(1)">
      <app-icon name="chevron-right" [size]="18" color="currentColor" />
    </app-button>
  </div>
  <app-segmented-control [options]="views" [value]="view()" (valueChange)="setView($event)" />
</div>
