<aside class="sidebar" [class.sidebar--collapsed]="collapsed()">
  <div class="sidebar__header">
    <app-logo [compact]="collapsed()" />
    <button type="button" class="sidebar__toggle" (click)="toggle()">
      <app-icon name="layout-sidebar" color="currentColor" />
    </button>
  </div>

  <label class="sidebar__search">
    <app-icon name="search" color="currentColor" />
    @if (!collapsed()) {
      <input class="sidebar__search-input" type="search" placeholder="Buscar" />
    }
  </label>

  <nav class="sidebar__section">
    @if (!collapsed()) {
      <span class="sidebar__section-title">PRINCIPAL</span>
    }
    <app-nav-item label="Resumen del día" icon="clock" link="/" [exact]="true" [collapsed]="collapsed()" />
    <app-nav-item label="Agenda" icon="calendar" link="/agenda" [badge]="agendaCount()" [collapsed]="collapsed()" />
    <app-nav-item label="Listas" icon="list-check" link="/listas" [collapsed]="collapsed()" />
    <app-nav-item label="Notas" icon="pencil" link="/notas" [collapsed]="collapsed()" />
  </nav>

  <div class="sidebar__create">
    <button type="button" class="sidebar__create-main" (click)="createClick.emit()">
      <app-icon name="plus" color="currentColor" />
      @if (!collapsed()) {
        <span class="sidebar__create-label">Crear</span>
      }
    </button>
    @if (!collapsed()) {
      <button type="button" class="sidebar__create-voice" (click)="voiceClick.emit()">
        <app-icon name="microphone" color="currentColor" />
      </button>
    }
  </div>

  @if (!collapsed()) {
    <div class="sidebar__section">
      <span class="sidebar__section-title">MIS LISTAS</span>
      @for (list of lists(); track list.name) {
        <div class="sidebar__list">
          <span class="sidebar__list-dot" [style.background-color]="list.color"></span>
          <span class="sidebar__list-name">{{ list.name }}</span>
        </div>
      }
    </div>
  }

  <div class="sidebar__footer">
    <app-nav-item label="Ajustes" icon="settings" link="/ajustes" [collapsed]="collapsed()" />
    <app-user-badge
      [name]="userName()"
      [loggedIn]="loggedIn()"
      [collapsed]="collapsed()"
      (profileClick)="profileClick.emit()"
      (loginClick)="loginClick.emit()"
    />
  </div>
</aside>
