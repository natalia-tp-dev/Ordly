<app-modal-base [open]="open()" title="Nueva tarea" (closed)="close()">
  <form class="form" (submit)="$event.preventDefault(); save()">
    <app-form-field
      label="Título"
      placeholder="Ej. Leer capítulo 4 de sistemas operativos"
      fieldId="task-title"
      [required]="true"
      [(value)]="title"
    />

    <app-form-field
      type="select"
      label="Lista"
      placeholder="Seleccionar lista"
      fieldId="task-list"
      [options]="lists()"
      [(value)]="list"
    />

    <div class="form__row">
      <app-form-field label="Fecha" inputType="date" fieldId="task-date" [(value)]="date" />
      <app-form-field label="Hora (opcional)" inputType="time" fieldId="task-time" [(value)]="time" />
    </div>

    <div class="form__group">
      <span class="form__label">Prioridad</span>
      <div class="form__chips">
        @for (option of priorities; track option.value) {
          <button
            type="button"
            class="form__chip"
            [class.form__chip--selected]="priority() === option.value"
            (click)="priority.set(option.value)"
          >
            <app-chip [label]="option.label" [variant]="option.value" />
          </button>
        }
      </div>
    </div>

    <app-form-field
      label="Notas (opcional)"
      placeholder="Detalles adicionales…"
      fieldId="task-notes"
      [(value)]="notes"
    />

    <div class="form__actions">
      <app-button variant="text" (click)="close()">Cancelar</app-button>
      <app-button variant="primary" type="submit" [disabled]="!title().trim()">Crear tarea</app-button>
    </div>
  </form>
</app-modal-base>
