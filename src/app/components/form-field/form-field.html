<div class="form-field" [class.form-field--error]="errorText()">
  @if (label()) {
    <label class="form-field__label" [for]="fieldId()">{{ label() }}</label>
  }

  @switch (type()) {
    @case ('select') {
      <div class="form-field__select">
        <select
          class="form-field__control"
          [class.form-field__control--empty]="!value()"
          [id]="fieldId()"
          [value]="value()"
          [disabled]="disabled()"
          [required]="required()"
          (change)="value.set($any($event.target).value)"
        >
          <option value="" disabled>{{ placeholder() }}</option>
          @for (option of options(); track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        <app-icon class="form-field__chevron" name="chevron-down" color="currentColor" />
      </div>
    }
    @case ('textarea') {
      <textarea
        class="form-field__control form-field__textarea"
        [id]="fieldId()"
        [placeholder]="placeholder()"
        [value]="value()"
        [disabled]="disabled()"
        [required]="required()"
        (input)="value.set($any($event.target).value)"
      ></textarea>
    }
    @default {
      <input
        class="form-field__control"
        [id]="fieldId()"
        [type]="inputType()"
        [placeholder]="placeholder()"
        [value]="value()"
        [disabled]="disabled()"
        [required]="required()"
        (input)="value.set($any($event.target).value)"
      />
    }
  }

  @if (errorText() || helpText()) {
    <span class="form-field__message">{{ errorText() || helpText() }}</span>
  }
</div>
