<div class="task-item" [class.task-item--completed]="completed()">
  <app-checkbox [(checked)]="completed" />
  <div class="task-item__text">
    <span class="task-item__title">{{ title() }}</span>
    @if (meta()) {
      <span class="task-item__meta">{{ meta() }}</span>
    }
  </div>
  <app-chip [label]="chipLabel()" [variant]="chipVariant()" />
</div>
