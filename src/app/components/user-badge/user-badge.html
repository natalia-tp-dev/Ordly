<button type="button" class="user-badge" [class.user-badge--collapsed]="collapsed()" (click)="onClick()">
  @if (loggedIn()) {
    <span class="user-badge__avatar">{{ initials() }}</span>
  } @else {
    <span class="user-badge__avatar user-badge__avatar--guest">
      <app-icon name="user" [size]="15" color="currentColor" />
    </span>
  }

  @if (!collapsed()) {
    <span class="user-badge__info">
      @if (loggedIn()) {
        <span class="user-badge__name">{{ name() }}</span>
        <span class="user-badge__hint">Ver perfil</span>
      } @else {
        <span class="user-badge__name user-badge__name--login">Iniciar sesión</span>
        <span class="user-badge__hint">Crea tu cuenta gratis</span>
      }
    </span>
    <app-icon name="chevron-right" [size]="15" color="currentColor" />
  }
</button>
