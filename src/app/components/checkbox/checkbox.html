<label class="checkbox" [class.checkbox--disabled]="disabled()">
  <input
    class="checkbox__input"
    type="checkbox"
    [checked]="checked()"
    [disabled]="disabled()"
    [attr.aria-label]="showLabel() ? null : label()"
    (change)="onChange($event)"
  />
  @if (showLabel()) {
    <span class="checkbox__label">{{ label() }}</span>
  }
</label>
