@if (file(); as selected) {
  <div class="attachment__file">
    <div class="attachment__info">
      <span class="attachment__name">{{ selected.name }}</span>
      <span class="attachment__size">{{ fileSize() }}</span>
    </div>
    <button type="button" class="attachment__remove" (click)="remove()">
      <app-icon name="x" [size]="16" color="currentColor" />
    </button>
  </div>
} @else {
  <label class="attachment__picker">
    <app-icon name="paperclip" color="currentColor" />
    <span>{{ label() }}</span>
    <input class="attachment__input" type="file" (change)="select($event)" />
  </label>
}
