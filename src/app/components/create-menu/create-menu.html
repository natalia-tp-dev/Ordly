<app-modal-base [open]="open()" title="¿Qué quieres crear?" [width]="620" (closed)="open.set(false)">
  <form class="create__ai" (submit)="$event.preventDefault(); submit()">
    <input
      class="create__ai-input"
      type="text"
      placeholder="Escribe o dicta lo que necesitas recordar..."
      [value]="text()"
      (input)="text.set($any($event.target).value)"
    />
    <button type="button" class="create__ai-voice" (click)="voiceClick.emit()">
      <app-icon name="microphone" color="currentColor" />
    </button>
  </form>

  <div class="create__options">
    @for (option of options; track option.value) {
      <button type="button" class="create__option" (click)="choose(option.value)">
        <span class="create__option-icon create__option-icon--{{ option.value }}">
          <app-icon [name]="option.icon" color="currentColor" />
        </span>
        <span class="create__option-label">{{ option.label }}</span>
        <span class="create__option-description">{{ option.description }}</span>
      </button>
    }
  </div>
</app-modal-base>

<app-reminder-form [(open)]="reminderOpen" (create)="reminderCreate.emit($event)" />
<app-task-form [(open)]="taskOpen" (create)="taskCreate.emit($event)" />
